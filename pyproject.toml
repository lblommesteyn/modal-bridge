[project]
name = "modal-bridge-gateway"
version = "0.2.0"
description = "An HTTP job gateway for Modal and edge runtimes"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "modal>=1,<2",
    "python-dotenv>=1,<2",
]

[project.scripts]
modal-bridge = "modal_bridge.cli:main"

[project.urls]
Repository = "https://github.com/lblommesteyn/modal-bridge"

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gateway/modal_bridge"]

[tool.pytest.ini_options]
testpaths = ["gateway/tests"]
